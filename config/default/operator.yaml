# One replica. Recreate plus leader election: during a rollout the old pod stops before the new
# one starts, and if two ever overlapped (a slow termination) only the lease holder reconciles.
# The lease Role is in config/rbac/role.yaml. Images are loaded into the cluster by
# `make load-images`, so they are never pulled.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consonance-operator
  namespace: consonance-system
  labels:
    app.kubernetes.io/name: consonance-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: consonance-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consonance-operator
    spec:
      serviceAccountName: consonance-operator
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operator
        image: consonance/operator:dev
        imagePullPolicy: Never
        args:
        - --agent-image=consonance/agent:dev
        - --postgres-image=consonance/postgres:17-dev
        - --leader-elect
        env:
        # Keeps the Go heap under the 128Mi limit so the GC works before the OOM killer does.
        - name: GOMEMLIMIT
          value: 100MiB
        ports:
        - name: metrics
          containerPort: 8080
        - name: probes
          containerPort: 8081
        livenessProbe:
          httpGet:
            path: /healthz
            port: probes
        readinessProbe:
          httpGet:
            path: /readyz
            port: probes
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
