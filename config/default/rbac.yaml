# Service accounts and their bindings. The rules are in config/rbac (generated by `make generate`
# from the kubebuilder markers) and are not copied here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: consonance-operator
  namespace: consonance-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: consonance-apiserver
  namespace: consonance-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: consonance-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: consonance-operator
subjects:
- kind: ServiceAccount
  name: consonance-operator
  namespace: consonance-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: consonance-operator
  namespace: consonance-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: consonance-operator
subjects:
- kind: ServiceAccount
  name: consonance-operator
  namespace: consonance-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: consonance-apiserver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: consonance-apiserver
subjects:
- kind: ServiceAccount
  name: consonance-apiserver
  namespace: consonance-system
