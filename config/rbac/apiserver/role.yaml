---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: consonance-apiserver
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - create
  - delete
  - get
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - consonance.io
  resources:
  - branches
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - consonance.io
  resources:
  - projects
  verbs:
  - create
  - get
  - list
  - watch
