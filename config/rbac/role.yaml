---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: consonance-operator
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - pods
  - resourcequotas
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - consonance.io
  resources:
  - branches
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - consonance.io
  resources:
  - branches/finalizers
  - projects/finalizers
  verbs:
  - update
- apiGroups:
  - consonance.io
  resources:
  - branches/status
  - projects/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - consonance.io
  resources:
  - projects
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
